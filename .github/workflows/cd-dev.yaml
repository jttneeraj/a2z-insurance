name: CD - Deploy Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: a2z-registry-non-prod
  IMAGE_NAME: a2z-insurance
  NAMESPACE: a2z-dev
  CLUSTER_NAME: a2z-non-prod-k8s

jobs:
  build-and-deploy:
    name: Build and Deploy to Dev
    runs-on: a2z-do-runner
    environment:
      name: dev
      url: https://dev.a2zsuvidhaa.in/insurance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from properties
        id: version
        run: |
          VERSION=$(grep 'build.version=' version.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-dev
          build-args: |
            GITHUB_TOKEN=${{ secrets.GH_PAT }}
            SHARED_LIB_BRANCH=develop
          no-cache: true

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy with Helm
        run: |
          helm upgrade --install a2z-insurance ./helm/a2z-insurance \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values ./helm/a2z-insurance/values-dev.yaml \
            --set image.tag=${{ steps.version.outputs.version }}-dev \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/a2z-insurance -n ${{ env.NAMESPACE }} --timeout=3m
          kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=a2z-insurance

      - name: Summary
        if: always()
        run: |
          echo "### Dev Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}-dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://dev.a2zsuvidhaa.in/insurance |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
