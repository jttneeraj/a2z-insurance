name: CI - Build and Test

on:
  pull_request:
    branches:
      - uat
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          if [[ ! "$PR_TITLE" =~ ^#[0-9]+[:\s].+ ]]; then
            echo "❌ Invalid PR title format!"
            echo "Expected format: #XXXX: Description"
            exit 1
          fi
          echo "✅ PR title format is valid!"

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: pr-title-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git for private repo
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: a2z-insurance:test
          build-args: |
            GITHUB_TOKEN=${{ secrets.GH_PAT }}

      - name: Summary
        run: |
          echo "### ✅ CI Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "- PR Title: \`${{ github.event.pull_request.title }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> $GITHUB_STEP_SUMMARY
