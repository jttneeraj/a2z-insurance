apiVersion: v1
kind: Service
metadata:
  name: {{ include "a2z-insurance.fullname" . }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2z-insurance.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "a2z-insurance.selectorLabels" . | nindent 4 }}
